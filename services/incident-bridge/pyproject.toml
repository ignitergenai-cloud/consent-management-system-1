[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-bridge"
version = "0.1.0"
description = "CMS Incident Bridge Service - MIMS Integration"
requires-python = ">=3.12"
dependencies = ["cms-shared", "fastapi>=0.115.0", "uvicorn[standard]>=0.34.0"]

[tool.setuptools.packages.find]
where = ["src"]

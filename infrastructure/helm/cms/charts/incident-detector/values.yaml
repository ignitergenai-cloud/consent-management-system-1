replicaCount: 1

image:
  repository: cms/incident-detector
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8003

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

healthCheck:
  path: /api/v1/health
  readyPath: /api/v1/health/ready
  port: 8003

incidentDetection:
  failureRateThreshold: "0.3"
  detectionIntervalSeconds: "60"
  detectionWindowMinutes: "15"

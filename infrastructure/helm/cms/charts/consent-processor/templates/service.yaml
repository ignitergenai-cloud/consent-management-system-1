apiVersion: v1
kind: Service
metadata:
  name: {{ include "consent-processor.fullname" . }}
  labels:
    {{- include "consent-processor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
  selector:
    {{- include "consent-processor.selectorLabels" . | nindent 4 }}

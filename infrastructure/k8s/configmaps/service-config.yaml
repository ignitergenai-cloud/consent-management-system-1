apiVersion: v1
kind: ConfigMap
metadata:
  name: service-config
  namespace: cms
data:
  # ── SNS Topic ARNs (shared settings) ──
  # All consent lifecycle events go to a single fan-out topic
  CONSENT_CREATED_TOPIC_ARN: "arn:aws:sns:us-east-1:123456789012:cms-consent-events"
  CONSENT_GRANTED_TOPIC_ARN: "arn:aws:sns:us-east-1:123456789012:cms-consent-events"
  CONSENT_DENIED_TOPIC_ARN: "arn:aws:sns:us-east-1:123456789012:cms-consent-events"
  CONSENT_EXPIRED_TOPIC_ARN: "arn:aws:sns:us-east-1:123456789012:cms-consent-events"
  CONSENT_REVOKED_TOPIC_ARN: "arn:aws:sns:us-east-1:123456789012:cms-consent-events"
  NOTIFICATION_SENT_TOPIC_ARN: "arn:aws:sns:us-east-1:123456789012:cms-notification-commands"
  INCIDENT_DETECTED_TOPIC_ARN: "arn:aws:sns:us-east-1:123456789012:cms-incident-events"

  # ── SQS Queue URLs (shared settings) ──
  CONSENT_CREATED_QUEUE_URL: "http://floci:4566/123456789012/cms-consent-processing-queue"
  NOTIFICATION_QUEUE_URL: "http://floci:4566/123456789012/cms-notification-queue"
  INCIDENT_QUEUE_URL: "http://floci:4566/123456789012/cms-incident-detection-queue"

  # ── Service-specific SQS / SNS ──
  # consent-api
  INTERNAL_COMMANDS_QUEUE_URL: "http://floci:4566/123456789012/cms-internal-commands-queue"
  # consent-processor
  NOTIFICATION_STATUS_QUEUE_URL: "http://floci:4566/123456789012/cms-notification-status-queue"
  # incident-detector
  INCIDENT_DETECTION_QUEUE_URL: "http://floci:4566/123456789012/cms-incident-detection-queue"
  # incident-bridge
  SQS_INCIDENT_BRIDGE_QUEUE: "http://floci:4566/123456789012/cms-incident-bridge-queue"
  SQS_INCIDENT_COMMANDS_QUEUE: "http://floci:4566/123456789012/cms-incident-commands-queue"
  SNS_MIMS_INBOUND_TOPIC: "arn:aws:sns:us-east-1:123456789012:mims-inbound-incidents"
  SNS_INTERNAL_COMMANDS_TOPIC: "arn:aws:sns:us-east-1:123456789012:cms-internal-commands"

  # ── Incident Detection Config ──
  FAILURE_RATE_THRESHOLD: "0.3"
  DETECTION_INTERVAL_SECONDS: "60"
  DETECTION_WINDOW_MINUTES: "15"

  # ── Service URLs ──
  CONSENT_API_URL: "http://consent-api:8000"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8002"

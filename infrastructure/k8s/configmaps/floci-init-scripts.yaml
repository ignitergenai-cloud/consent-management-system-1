apiVersion: v1
kind: ConfigMap
metadata:
  name: floci-init-scripts
  namespace: cms
data:
  01-bootstrap.sh: |
    #!/bin/bash
    set -euo pipefail
    ENDPOINT="http://localhost:4566"
    REGION="us-east-1"
    ACCOUNT="000000000000"

    echo "=== DynamoDB ==="
    awslocal dynamodb create-table \
      --table-name cms-consents \
      --key-schema \
        AttributeName=PK,KeyType=HASH \
        AttributeName=SK,KeyType=RANGE \
      --attribute-definitions \
        AttributeName=PK,AttributeType=S \
        AttributeName=SK,AttributeType=S \
        AttributeName=GSI1PK,AttributeType=S \
        AttributeName=GSI1SK,AttributeType=S \
        AttributeName=GSI2PK,AttributeType=S \
        AttributeName=GSI2SK,AttributeType=S \
        AttributeName=GSI3PK,AttributeType=S \
        AttributeName=GSI3SK,AttributeType=S \
      --global-secondary-indexes \
        'IndexName=GSI1,KeySchema=[{AttributeName=GSI1PK,KeyType=HASH},{AttributeName=GSI1SK,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
        'IndexName=GSI2,KeySchema=[{AttributeName=GSI2PK,KeyType=HASH},{AttributeName=GSI2SK,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
        'IndexName=GSI3,KeySchema=[{AttributeName=GSI3PK,KeyType=HASH},{AttributeName=GSI3SK,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
      --billing-mode PAY_PER_REQUEST \
      --region "$REGION" 2>/dev/null || echo "  Table already exists"
    echo "  Table cms-consents ready"

    echo "=== SNS Topics ==="
    TOPICS=(
      cms-consent-events
      cms-notification-commands
      cms-notification-events
      cms-incident-events
      cms-internal-commands
      mims-inbound-incidents
      cms-incident-commands
    )
    declare -A TOPIC_ARNS
    for t in "${TOPICS[@]}"; do
      ARN=$(awslocal sns create-topic --name "$t" --region "$REGION" --query 'TopicArn' --output text)
      TOPIC_ARNS[$t]=$ARN
      echo "  Created: $t"
    done

    echo "=== SQS Queues ==="
    QUEUES=(
      cms-consent-processing-queue
      cms-notification-queue
      cms-notification-status-queue
      cms-incident-detection-queue
      cms-incident-bridge-queue
      cms-incident-commands-queue
      cms-internal-commands-queue
    )
    for q in "${QUEUES[@]}"; do
      DLQ="${q}-dlq"
      awslocal sqs create-queue --queue-name "$DLQ" --region "$REGION" > /dev/null
      DLQ_ARN="arn:aws:sqs:${REGION}:${ACCOUNT}:${DLQ}"
      awslocal sqs create-queue \
        --queue-name "$q" \
        --attributes "{\"RedrivePolicy\":\"{\\\"deadLetterTargetArn\\\":\\\"${DLQ_ARN}\\\",\\\"maxReceiveCount\\\":\\\"3\\\"}\"}" \
        --region "$REGION" > /dev/null
      echo "  Created: $q (with DLQ)"
    done

    echo "=== SNS → SQS Subscriptions ==="
    SUBS=(
      "cms-consent-events:cms-consent-processing-queue"
      "cms-consent-events:cms-incident-detection-queue"
      "cms-notification-commands:cms-notification-queue"
      "cms-notification-events:cms-notification-status-queue"
      "cms-incident-events:cms-incident-bridge-queue"
      "cms-internal-commands:cms-internal-commands-queue"
      "cms-incident-commands:cms-incident-commands-queue"
    )
    for sub in "${SUBS[@]}"; do
      TOPIC_NAME="${sub%%:*}"
      QUEUE_NAME="${sub##*:}"
      TOPIC_ARN="${TOPIC_ARNS[$TOPIC_NAME]}"
      QUEUE_ARN="arn:aws:sqs:${REGION}:${ACCOUNT}:${QUEUE_NAME}"
      awslocal sns subscribe \
        --topic-arn "$TOPIC_ARN" \
        --protocol sqs \
        --notification-endpoint "$QUEUE_ARN" \
        --region "$REGION" > /dev/null
      echo "  $QUEUE_NAME → $TOPIC_NAME"
    done

    echo "=== S3 ==="
    awslocal s3 mb s3://cms-consent-documents --region "$REGION" 2>/dev/null || echo "  Bucket already exists"
    echo "  Bucket cms-consent-documents ready"

    echo "=== SES ==="
    awslocal ses verify-email-identity \
      --email-address no-reply@cms.example.com \
      --region "$REGION"
    echo "  Verified: no-reply@cms.example.com"

    echo ""
    echo "✅ All AWS resources bootstrapped successfully!"

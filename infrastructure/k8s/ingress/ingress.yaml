apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cms-ingress
  namespace: cms
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: cms.local
      http:
        paths:
          # Incident detector API (must come before general /api catch-all)
          - path: /api/v1/incidents
            pathType: Prefix
            backend:
              service:
                name: incident-detector
                port:
                  number: 8003
          # Consent API (all other /api routes)
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: consent-api
                port:
                  number: 8000
          # Frontend (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

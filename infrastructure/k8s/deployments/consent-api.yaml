apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-api
  namespace: cms
  labels:
    app.kubernetes.io/name: consent-api
    app.kubernetes.io/part-of: consent-management-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: consent-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consent-api
    spec:
      containers:
        - name: consent-api
          image: cms/consent-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: aws-config
            - configMapRef:
                name: service-config
            - secretRef:
                name: aws-credentials
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: consent-api
  namespace: cms
  labels:
    app.kubernetes.io/name: consent-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: consent-api

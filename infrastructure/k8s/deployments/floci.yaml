apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: floci-data
  namespace: cms
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  namespace: cms
  labels:
    app.kubernetes.io/name: floci
    app.kubernetes.io/part-of: consent-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: floci
  template:
    metadata:
      labels:
        app.kubernetes.io/name: floci
    spec:
      containers:
        - name: floci
          image: localstack/localstack:latest
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "dynamodb,sns,sqs,s3,ses"
            - name: DEFAULT_REGION
              value: "us-east-1"
            - name: EAGER_SERVICE_LOADING
              value: "1"
          volumeMounts:
            - name: floci-data
              mountPath: /var/lib/localstack
            - name: init-scripts
              mountPath: /etc/localstack/init/ready.d
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: floci-data
          persistentVolumeClaim:
            claimName: floci-data
        - name: init-scripts
          configMap:
            name: floci-init-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: floci
  namespace: cms
  labels:
    app.kubernetes.io/name: floci
spec:
  type: ClusterIP
  ports:
    - port: 4566
      targetPort: 4566
      protocol: TCP
  selector:
    app.kubernetes.io/name: floci

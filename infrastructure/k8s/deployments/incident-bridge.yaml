apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-bridge
  namespace: cms
  labels:
    app.kubernetes.io/name: incident-bridge
    app.kubernetes.io/part-of: consent-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: incident-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: incident-bridge
    spec:
      containers:
        - name: incident-bridge
          image: cms/incident-bridge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8004
          envFrom:
            - configMapRef:
                name: aws-config
            - configMapRef:
                name: service-config
            - secretRef:
                name: aws-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: incident-bridge
  namespace: cms
  labels:
    app.kubernetes.io/name: incident-bridge
spec:
  type: ClusterIP
  ports:
    - port: 8004
      targetPort: 8004
      protocol: TCP
  selector:
    app.kubernetes.io/name: incident-bridge

name: Deploy CMS to Vercel

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy CMS Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@47

      - name: Deploy CMS Backend
        env:
          VERCEL_ORG_ID: team_6a7Nqe3X6zNR256vjg5Vk7Kk
          VERCEL_PROJECT_ID: prj_Yc4Sn0R7PDAjgfz8FCr1zl9NMF3f
        run: |
          vercel pull --yes --environment=production --token=vcp_3RjYE7oWC1L6uz7dTogHFv8C2cHx5R6eLZASpxFvWYg1SpFrVp2hpZts
          vercel build --prod --token=vcp_3RjYE7oWC1L6uz7dTogHFv8C2cHx5R6eLZASpxFvWYg1SpFrVp2hpZts
          vercel deploy --prebuilt --prod --token=vcp_3RjYE7oWC1L6uz7dTogHFv8C2cHx5R6eLZASpxFvWYg1SpFrVp2hpZts

  deploy-frontend:
    name: Deploy CMS Frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@47

      - name: Deploy CMS Frontend
        working-directory: frontend
        env:
          VERCEL_ORG_ID: team_6a7Nqe3X6zNR256vjg5Vk7Kk
          VERCEL_PROJECT_ID: prj_W8CiznS9yE0sfF0ZJ4ye36CDDgJr
        run: |
          vercel pull --yes --environment=production --token=vcp_3RjYE7oWC1L6uz7dTogHFv8C2cHx5R6eLZASpxFvWYg1SpFrVp2hpZts
          vercel build --prod --token=vcp_3RjYE7oWC1L6uz7dTogHFv8C2cHx5R6eLZASpxFvWYg1SpFrVp2hpZts
          vercel deploy --prebuilt --prod --token=vcp_3RjYE7oWC1L6uz7dTogHFv8C2cHx5R6eLZASpxFvWYg1SpFrVp2hpZts

version: "3.8"

services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      - FLOCI_DEFAULT_REGION=us-east-1
    volumes:
      - floci-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
      - ./infrastructure/floci/init-aws.d:/etc/localstack/init/ready.d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  consent-api:
    build:
      context: .
      dockerfile: docker/consent-api.Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE_NAME=cms-consents
      - SNS_CONSENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-consent-events
      - SNS_NOTIFICATION_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-commands
      - SNS_NOTIFICATION_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-events
      - SNS_INCIDENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-events
      - SNS_INTERNAL_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-internal-commands
      - SNS_MIMS_INBOUND_TOPIC=arn:aws:sns:us-east-1:000000000000:mims-inbound-incidents
      - SNS_MIMS_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-commands
      - SQS_CONSENT_PROCESSING_QUEUE=http://floci:4566/000000000000/cms-consent-processing-queue
      - SQS_NOTIFICATION_QUEUE=http://floci:4566/000000000000/cms-notification-queue
      - SQS_NOTIFICATION_STATUS_QUEUE=http://floci:4566/000000000000/cms-notification-status-queue
      - SQS_INCIDENT_DETECTION_QUEUE=http://floci:4566/000000000000/cms-incident-detection-queue
      - SQS_INCIDENT_BRIDGE_QUEUE=http://floci:4566/000000000000/cms-incident-bridge-queue
      - SQS_INCIDENT_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-incident-commands-queue
      - SQS_INTERNAL_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-internal-commands-queue
      - S3_CONSENT_DOCUMENTS_BUCKET=cms-consent-documents
      - SES_FROM_EMAIL=no-reply@cms.example.com
    depends_on:
      floci:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: docker/notification-service.Dockerfile
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE_NAME=cms-consents
      - SNS_CONSENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-consent-events
      - SNS_NOTIFICATION_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-commands
      - SNS_NOTIFICATION_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-events
      - SNS_INCIDENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-events
      - SNS_INTERNAL_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-internal-commands
      - SNS_MIMS_INBOUND_TOPIC=arn:aws:sns:us-east-1:000000000000:mims-inbound-incidents
      - SNS_MIMS_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-commands
      - SQS_CONSENT_PROCESSING_QUEUE=http://floci:4566/000000000000/cms-consent-processing-queue
      - SQS_NOTIFICATION_QUEUE=http://floci:4566/000000000000/cms-notification-queue
      - SQS_NOTIFICATION_STATUS_QUEUE=http://floci:4566/000000000000/cms-notification-status-queue
      - SQS_INCIDENT_DETECTION_QUEUE=http://floci:4566/000000000000/cms-incident-detection-queue
      - SQS_INCIDENT_BRIDGE_QUEUE=http://floci:4566/000000000000/cms-incident-bridge-queue
      - SQS_INCIDENT_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-incident-commands-queue
      - SQS_INTERNAL_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-internal-commands-queue
      - S3_CONSENT_DOCUMENTS_BUCKET=cms-consent-documents
      - SES_FROM_EMAIL=no-reply@cms.example.com
    depends_on:
      floci:
        condition: service_healthy

  consent-processor:
    build:
      context: .
      dockerfile: docker/consent-processor.Dockerfile
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE_NAME=cms-consents
      - SNS_CONSENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-consent-events
      - SNS_NOTIFICATION_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-commands
      - SNS_NOTIFICATION_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-events
      - SNS_INCIDENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-events
      - SNS_INTERNAL_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-internal-commands
      - SNS_MIMS_INBOUND_TOPIC=arn:aws:sns:us-east-1:000000000000:mims-inbound-incidents
      - SNS_MIMS_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-commands
      - SQS_CONSENT_PROCESSING_QUEUE=http://floci:4566/000000000000/cms-consent-processing-queue
      - SQS_NOTIFICATION_QUEUE=http://floci:4566/000000000000/cms-notification-queue
      - SQS_NOTIFICATION_STATUS_QUEUE=http://floci:4566/000000000000/cms-notification-status-queue
      - SQS_INCIDENT_DETECTION_QUEUE=http://floci:4566/000000000000/cms-incident-detection-queue
      - SQS_INCIDENT_BRIDGE_QUEUE=http://floci:4566/000000000000/cms-incident-bridge-queue
      - SQS_INCIDENT_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-incident-commands-queue
      - SQS_INTERNAL_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-internal-commands-queue
      - S3_CONSENT_DOCUMENTS_BUCKET=cms-consent-documents
      - SES_FROM_EMAIL=no-reply@cms.example.com
    depends_on:
      floci:
        condition: service_healthy

  incident-detector:
    build:
      context: .
      dockerfile: docker/incident-detector.Dockerfile
    ports:
      - "8003:8003"
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE_NAME=cms-consents
      - SNS_CONSENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-consent-events
      - SNS_NOTIFICATION_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-commands
      - SNS_NOTIFICATION_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-events
      - SNS_INCIDENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-events
      - SNS_INTERNAL_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-internal-commands
      - SNS_MIMS_INBOUND_TOPIC=arn:aws:sns:us-east-1:000000000000:mims-inbound-incidents
      - SNS_MIMS_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-commands
      - SQS_CONSENT_PROCESSING_QUEUE=http://floci:4566/000000000000/cms-consent-processing-queue
      - SQS_NOTIFICATION_QUEUE=http://floci:4566/000000000000/cms-notification-queue
      - SQS_NOTIFICATION_STATUS_QUEUE=http://floci:4566/000000000000/cms-notification-status-queue
      - SQS_INCIDENT_DETECTION_QUEUE=http://floci:4566/000000000000/cms-incident-detection-queue
      - SQS_INCIDENT_BRIDGE_QUEUE=http://floci:4566/000000000000/cms-incident-bridge-queue
      - SQS_INCIDENT_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-incident-commands-queue
      - SQS_INTERNAL_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-internal-commands-queue
      - S3_CONSENT_DOCUMENTS_BUCKET=cms-consent-documents
      - SES_FROM_EMAIL=no-reply@cms.example.com
      - INCIDENT_FAILURE_RATE_THRESHOLD=0.3
      - INCIDENT_DETECTION_INTERVAL_SECONDS=60
      - INCIDENT_DETECTION_WINDOW_MINUTES=15
    depends_on:
      floci:
        condition: service_healthy

  incident-bridge:
    build:
      context: .
      dockerfile: docker/incident-bridge.Dockerfile
    ports:
      - "8004:8004"
    env_file:
      - .env
    environment:
      - AWS_ENDPOINT_URL=http://floci:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE_NAME=cms-consents
      - SNS_CONSENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-consent-events
      - SNS_NOTIFICATION_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-commands
      - SNS_NOTIFICATION_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-notification-events
      - SNS_INCIDENT_EVENTS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-events
      - SNS_INTERNAL_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-internal-commands
      - SNS_MIMS_INBOUND_TOPIC=arn:aws:sns:us-east-1:000000000000:mims-inbound-incidents
      - SNS_MIMS_COMMANDS_TOPIC=arn:aws:sns:us-east-1:000000000000:cms-incident-commands
      - SQS_CONSENT_PROCESSING_QUEUE=http://floci:4566/000000000000/cms-consent-processing-queue
      - SQS_NOTIFICATION_QUEUE=http://floci:4566/000000000000/cms-notification-queue
      - SQS_NOTIFICATION_STATUS_QUEUE=http://floci:4566/000000000000/cms-notification-status-queue
      - SQS_INCIDENT_DETECTION_QUEUE=http://floci:4566/000000000000/cms-incident-detection-queue
      - SQS_INCIDENT_BRIDGE_QUEUE=http://floci:4566/000000000000/cms-incident-bridge-queue
      - SQS_INCIDENT_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-incident-commands-queue
      - SQS_INTERNAL_COMMANDS_QUEUE=http://floci:4566/000000000000/cms-internal-commands-queue
      - S3_CONSENT_DOCUMENTS_BUCKET=cms-consent-documents
      - SES_FROM_EMAIL=no-reply@cms.example.com
    depends_on:
      floci:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - consent-api

volumes:
  floci-data:
    driver: local
